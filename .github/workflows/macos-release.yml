name: macOS Bundle and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch'
    name: Smoke (${{ matrix.label }})
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            target: aarch64-apple-darwin
          - label: Intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: soulmate/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: soulmate/src-tauri
          key: macos-${{ matrix.target }}
      - run: node scripts/check-version.mjs
      - run: npm ci
        working-directory: soulmate
      - name: Build ad-hoc signed smoke bundle
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_SIGNING_IDENTITY: "-"
        with:
          projectPath: soulmate
          args: --target ${{ matrix.target }} --bundles app,dmg
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: soulmate-smoke-${{ matrix.target }}-[bundle]
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    name: Release (${{ matrix.label }})
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            target: aarch64-apple-darwin
          - label: Intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: soulmate/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: soulmate/src-tauri
          key: macos-${{ matrix.target }}
      - name: Verify release tag and application versions
        run: node scripts/check-version.mjs --tag "${GITHUB_REF_NAME}"
      - run: npm ci
        working-directory: soulmate
      - name: Build bundle and update draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional Apple Developer signing and notarization credentials.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: soulmate
          args: --target ${{ matrix.target }} --bundles app,dmg
          tagName: ${{ github.ref_name }}
          releaseName: SoulMate v__VERSION__
          releaseBody: macOS Apple Silicon and Intel bundles. Verify signing and notarization before publishing this draft.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
